<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Öl-topplistan</title>
<meta name="description" content="Vem har checkat in flest öl? Topplistan och senaste ölen för kompisgänget, direkt från Untappd.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍺%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Outfit:wght@300;500;600&display=swap">
<style>
/* Mörk bärnstensbotten med glaskort – samma stil som hemmets väggdashboard */
:root{color-scheme:dark;--bg:#0c0906;--fg:#f4efe8;--muted:#a99e90;--edge:rgba(255,255,255,.12);--gold:#f2c46b;--amber:#ff9f43;--red:#ff7b7b;
  --f-disp:"Outfit",ui-sans-serif,system-ui,sans-serif;--f-body:"Manrope",ui-sans-serif,system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(1200px 700px at 15% -10%,#5a3510 0%,transparent 60%),radial-gradient(900px 700px at 100% 110%,#3b2208 0%,transparent 55%),var(--bg);
  color:var(--fg);font-family:var(--f-body);font-size:15px}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-family:var(--f-disp);font-weight:500;font-size:clamp(34px,6vw,56px);margin:0;line-height:1}
h1 span{color:var(--gold)}
.sub{color:var(--muted);margin-top:6px}
.sound{all:unset;cursor:pointer;padding:10px 16px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid var(--edge);font-weight:600;font-size:14px}
.sound.on{background:linear-gradient(135deg,#ffd76a,#e8a52c);color:#2a1a02;border-color:transparent}
.sound:focus-visible,.card:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04) 50%,rgba(255,180,90,.06));border:1px solid var(--edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 18px 40px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border-radius:24px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.beer{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px}
.beer.fresh{border-color:rgba(242,196,107,.5)}
.av{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#222}
.what{min-width:0;display:flex;flex-direction:column;gap:2px}
.nm{display:flex;align-items:center;gap:4px 8px;min-width:0;flex-wrap:wrap}
.nm b{white-space:nowrap}
.what .bn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.what span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{display:flex;align-items:center;gap:10px}
.ago{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.ago b{display:block;font-family:var(--f-disp);font-weight:500;font-size:20px;color:var(--fg)}
.fresh .ago b{color:var(--gold)}
.logo{width:44px;height:44px;border-radius:10px;object-fit:cover;background:#fff}
.caps{display:inline-flex;gap:2px;vertical-align:-1px;margin-right:6px}
.caps i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.15)}
.caps i.f{background:var(--gold)}.caps i.h{background:linear-gradient(90deg,var(--gold) 50%,rgba(255,255,255,.15) 50%)}
.cnt{display:inline-flex;align-items:baseline;gap:6px;flex:none;padding:2px 9px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18)}
.cnt b{font-family:var(--f-disp);font-weight:600;font-size:14px}
.cnt i{font-style:normal;font-size:11px;font-weight:600}
.cnt.near{background:rgba(255,205,60,.22);border-color:rgba(255,205,60,.6)}.cnt.near b,.cnt.near i{color:#ffd54a}
.cnt.close{background:rgba(255,70,70,.26);border-color:rgba(255,90,90,.75);animation:pulse 1.6s ease-in-out infinite}.cnt.close b,.cnt.close i{color:var(--red)}
.cnt.hit{background:linear-gradient(135deg,#ffd76a,#e8a52c);border-color:transparent;box-shadow:0 0 16px rgba(255,200,80,.6)}.cnt.hit b,.cnt.hit i{color:#2a1a02}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,80,80,.5)}50%{box-shadow:0 0 0 6px rgba(255,80,80,0)}}
.top{padding:18px;position:sticky;top:16px}
.top h2{margin:0 0 12px;font-family:var(--f-disp);font-weight:500;font-size:24px}
.row{display:grid;grid-template-columns:34px 36px minmax(0,1fr);gap:10px;align-items:center;padding:7px 4px;border-top:1px solid rgba(255,255,255,.06)}
.row:first-of-type{border-top:0}
.row img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.row .pos{text-align:center;font-size:18px;font-weight:700;color:var(--muted)}
.row .who{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;min-width:0}
.row b{white-space:nowrap}
.foot{color:var(--muted);font-size:12px;text-align:center}
.foot a{color:var(--gold)}
/* popup */
.pop{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(5,4,3,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pop[hidden]{display:none}
.pop .box{width:min(760px,calc(100% - 32px));padding:26px;display:flex;flex-direction:column;gap:14px;animation:in .5s cubic-bezier(.2,.9,.3,1.15)}
.pop .t{font-family:var(--f-disp);font-size:clamp(22px,3.4vw,30px);font-weight:500}
.pop .bp{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center}
.pop .bav{width:clamp(90px,16vw,160px);height:clamp(90px,16vw,160px);border-radius:50%;object-fit:cover;box-shadow:0 0 0 4px rgba(242,196,107,.5)}
.pop .blogo{width:clamp(90px,16vw,160px);height:clamp(90px,16vw,160px);border-radius:24px;object-fit:cover;background:#fff}
.pop .bb{font-family:var(--f-disp);font-size:clamp(22px,3.6vw,36px);line-height:1.1}
.pop .bs{color:#e4dbcf;font-size:16px;margin-top:6px}
.pop .bar{height:3px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}.pop .bar i{display:block;height:100%;background:var(--gold)}
@keyframes in{from{transform:translateY(16px) scale(.95);opacity:0}to{transform:none;opacity:1}}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}.top{position:static}}
@media (max-width:640px){.grid{grid-template-columns:minmax(0,1fr)}.pop .bp{grid-template-columns:1fr;justify-items:center;text-align:center}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Öl-<span>topplistan</span></h1><div class="sub" id="upd">Hämtar…</div></div>
    <button type="button" class="sound" id="sound">🔈 Slå på ljud för nya incheckningar</button>
  </header>
  <div class="layout">
    <div class="grid" id="grid"></div>
    <aside class="glass top"><h2>🏆 Flest incheckningar</h2><div id="top"></div></aside>
  </div>
  <div class="foot">Data från publika profiler på <a href="https://untappd.com" rel="noopener">Untappd</a>. Uppdateras löpande. Ha sidan öppen så hörs det när någon öppnar en öl. 🍻</div>
</div>
<div class="pop" id="pop" hidden><div class="box glass">
  <div class="t" id="p-t"></div>
  <div class="bp"><img class="bav" id="p-av" alt=""><div><div class="bb" id="p-beer"></div><div class="bs" id="p-brew"></div><div class="bs" id="p-rate"></div></div><img class="blogo" id="p-logo" alt=""></div>
  <div class="bar"><i id="p-bar"></i></div>
</div></div>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var seen=null, data=null, MEDAL=['🥇','🥈','🥉'];
  function jub(n){if(!n)return null;var next=Math.ceil((n+1)/100)*100,left=next-n,t=n.toLocaleString('sv-SE');
    if(n%100===0)return{c:'hit',t:t+'!',s:'Jubileum'};if(left<=3)return{c:'close',t:t+' öl',s:left+' kvar till '+next.toLocaleString('sv-SE')};
    if(left<=10)return{c:'near',t:t+' öl',s:left+' kvar till '+next.toLocaleString('sv-SE')};return{c:'',t:t+' öl'}}
  function badge(n){var j=jub(n);return j?'<span class="cnt '+j.c+'"><b>'+j.t+'</b>'+(j.s?'<i>'+j.s+'</i>':'')+'</span>':''}
  function caps(r){if(!r)return'';var h='<span class="caps">';for(var i=1;i<=5;i++)h+='<i class="'+(r>=i?'f':r>=i-.5?'h':'')+'"></i>';return h+'</span>'+r.toFixed(2).replace('.',',')}
  function ago(iso){var d=new Date(iso),a=new Date();a.setHours(0,0,0,0);var b=new Date(d);b.setHours(0,0,0,0);var n=Math.round((a-b)/864e5),t=d.toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'});
    return n<=0?{n:'Idag',s:t}:n===1?{n:'Igår',s:t}:{n:String(n),s:'dagar sedan'}}
  function render(){
    var F=data.friends.slice().sort(function(a,b){return new Date(b.at)-new Date(a.at)});
    $('grid').innerHTML=F.map(function(c){var a=ago(c.at),fresh=Date.now()-new Date(c.at)<864e5;
      return '<div class="glass beer'+(fresh?' fresh':'')+'"><img class="av" src="'+esc(c.avatar)+'" alt=""><div class="what"><div class="nm"><b>'+esc(c.name)+'</b>'+badge(c.total)+'</div><span class="bn">'+esc(c.beer)+'</span><span>'+esc(c.brewery)+(c.venue?' · '+esc(c.venue):'')+'</span><span>'+caps(c.rating)+'</span></div>'+
        '<div class="right"><div class="ago"><b>'+a.n+'</b>'+a.s+'</div>'+(c.logo?'<img class="logo" src="'+esc(c.logo)+'" alt="">':'')+'</div></div>'}).join('');
    var R=data.friends.filter(function(c){return c.total&&c.inTop!==false}).sort(function(a,b){return b.total-a.total});
    $('top').innerHTML=R.map(function(c,i){return '<div class="row"><span class="pos">'+(MEDAL[i]||i+1)+'</span><img src="'+esc(c.avatar)+'" alt=""><span class="who"><b>'+esc(c.name)+'</b>'+badge(c.total)+'</span></div>'}).join('');
    $('upd').textContent='Senast uppdaterad '+new Date(data.updated).toLocaleString('sv-SE',{weekday:'short',hour:'2-digit',minute:'2-digit'});
  }
  // Ljud: ett "pop" och kolsyra som pyser. Webbläsare kräver ett klick innan ljud får spelas.
  var actx=null,soundOn=false;
  $('sound').onclick=function(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();actx.resume();soundOn=true;this.classList.add('on');this.textContent='🔊 Ljud på';beer()}catch(e){}};
  function beer(){if(!soundOn||!actx)return;var a=actx,t=a.currentTime+.05,o=a.createOscillator(),g=a.createGain();
    o.frequency.setValueAtTime(900,t);o.frequency.exponentialRampToValueAtTime(120,t+.07);g.gain.setValueAtTime(1e-4,t);g.gain.exponentialRampToValueAtTime(.7,t+.005);g.gain.exponentialRampToValueAtTime(1e-4,t+.09);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.1);
    var len=a.sampleRate*1.6,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*(Math.random()<.02?1:.35);
    var n=a.createBufferSource();n.buffer=buf;var f=a.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(5200,t);f.frequency.exponentialRampToValueAtTime(2600,t+1.5);
    var ng=a.createGain();ng.gain.setValueAtTime(1e-4,t+.03);ng.gain.exponentialRampToValueAtTime(.45,t+.08);ng.gain.exponentialRampToValueAtTime(1e-4,t+1.6);n.connect(f).connect(ng).connect(a.destination);n.start(t+.03);n.stop(t+1.65)}
  var pt=null;
  function pop(c){
    $('p-t').textContent=c.total&&c.total%100===0?c.name+': '+c.total.toLocaleString('sv-SE')+':e ölen! 🎉':c.name+' checkade in 🍺';
    $('p-av').src=c.avatar||'';$('p-logo').src=c.logo||'';$('p-beer').textContent=c.beer;$('p-brew').textContent=c.brewery+(c.venue?' · '+c.venue:'');$('p-rate').innerHTML=caps(c.rating)+' '+badge(c.total);
    $('pop').hidden=false;beer();var end=Date.now()+60000;clearInterval(pt);
    pt=setInterval(function(){var l=Math.max(0,end-Date.now());$('p-bar').style.width=l/600+'%';if(!l){clearInterval(pt);$('pop').hidden=true}},250)}
  $('pop').onclick=function(){clearInterval(pt);this.hidden=true};
  function load(){
    fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
      data=d;var ids=d.friends.map(function(c){return c.id});
      if(seen){var fresh=d.friends.filter(function(c){return seen.indexOf(c.id)<0}).sort(function(a,b){return new Date(a.at)-new Date(b.at)});fresh.forEach(function(c,i){setTimeout(function(){pop(c)},i*61000)})}
      seen=ids;render()}).catch(function(){})}
  load();setInterval(load,60000);
  if(location.hash==='#test')setTimeout(function(){if(data)pop(data.friends[0])},1500);
})();
</script>
</body>
</html>
